# ============================================================================================
#  Crown Clash — origin nginx (Ubuntu, Hostinger VPS, behind Cloudflare)
#  Install as /etc/nginx/sites-available/crown-clash.conf, symlinked into sites-enabled.
#  Replace crownclash.example.com with the real hostname before `nginx -t`.
# ============================================================================================
#
#  CLOUDFLARE ASSUMPTIONS — read before changing anything
#  ------------------------------------------------------
#  The DNS record is PROXIED (orange cloud) and Cloudflare's SSL/TLS mode is
#  **Full (strict)**, terminated at the edge, with a **Cloudflare Origin CA certificate**
#  installed here. That combination and not another, for three reasons:
#
#   1. Browser→edge TLS is Cloudflare's; edge→origin TLS is this certificate. "Flexible" would
#      carry the second hop in cleartext across the public internet, which for a service whose
#      whole session is a cookie is simply broken. "Full" (non-strict) accepts any certificate
#      including a self-signed one, so it authenticates nothing.
#   2. Origin CA certificates are valid for 15 years and are issued by Cloudflare for exactly
#      this hop. There is no renewal cron to forget, which is the usual way an origin cert
#      expires and takes a site down at 3am.
#   3. The firewall opens 80/443 only to Cloudflare's ranges (ops/README.md), so an ACME
#      HTTP-01 challenge cannot reach this box while the record is proxied — plain Let's
#      Encrypt is not an option here. (DNS-01 would work; more moving parts, no gain.)
#
#  Consequences visible below:
#   * The real client IP arrives as CF-Connecting-IP, not in the socket address. It is restored
#     into $remote_addr by cloudflare-realip.conf so access logs, per-IP limits and the API's
#     anonymous rate-limit key see the player rather than a Cloudflare PoP.
#   * X-Forwarded-For is REWRITTEN to $remote_addr, never appended to with
#     $proxy_add_x_forwarded_for. Cloudflare forwards whatever XFF the client sent and appends
#     to it; Fastify runs `trustProxy: true` and takes the left-most entry. Appending would let
#     any client prepend an arbitrary address and impersonate it for rate-limiting. One entry,
#     written by us, from a source we authenticated.
#   * $scheme is always https at this vhost, because Cloudflare speaks TLS to the origin. The
#     :80 server exists only for direct-to-IP hits and a mistakenly grey-clouded record.
#
#  Paths this file expects (see ops/README.md and ops/deploy.sh):
#   * static:   /var/www/crown-clash/current   symlink → a release copy of apps/web/dist
#   * api:      127.0.0.1:8080                 PM2 app `crown-api` (HOST/PORT in the env file)
#   * certs:    /etc/ssl/crown-clash/origin.pem, origin.key
#   * snippets: /etc/nginx/snippets/crown-cloudflare-realip.conf
#               /etc/nginx/snippets/crown-security-headers.conf
# ============================================================================================

# Prefixed so it cannot collide with a $connection_upgrade another vhost on this box defines.
map $http_upgrade $crown_connection_upgrade {
  default upgrade;
  ''      close;
}

upstream crown_api {
  server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
  # Saves a TCP handshake + accept per request. Requires HTTP/1.1 and a cleared Connection
  # header on the proxying locations, both set below.
  keepalive 32;
}

# Cache-Control by asset class. The default is deliberately the *safe* one: any path that is
# not a fingerprinted asset ends up serving index.html through the SPA fallback, and caching
# that would keep a deployed-over bundle reference alive in browsers.
map $uri $crown_cache_control {
  default    "no-cache, no-store, must-revalidate";
  # Vite fingerprints every emitted chunk and stylesheet under /assets/, so the filename
  # changes whenever the bytes do — which is what makes `immutable` safe rather than reckless.
  ~^/assets/ "public, max-age=31536000, immutable";
  ~*\.(?:png|jpe?g|gif|svg|webp|ico|webmanifest|txt|woff2?)$ "public, max-age=86400";
}

# ---------------------------------------------------------------------------- :80 → :443
server {
  listen 80;
  # listen [::]:80;   # uncomment only if this VPS actually has IPv6, or nginx will fail to bind
  server_name crownclash.example.com www.crownclash.example.com;

  server_tokens off;

  # No ACME location on purpose: the certificate is Cloudflare Origin CA, not HTTP-01.
  return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------- :443
server {
  listen 443 ssl http2;
  # listen [::]:443 ssl http2;   # uncomment only if this VPS actually has IPv6
  # nginx >= 1.25.1 deprecates `http2` on the listen line in favour of a separate `http2 on;`.
  # The old form is kept because it is the one that works on the nginx shipped by every
  # currently-supported Ubuntu LTS; on newer builds it logs a warning and behaves identically.

  server_name crownclash.example.com www.crownclash.example.com;

  server_tokens off;
  charset utf-8;

  # -- TLS (Cloudflare Origin CA) ----------------------------------------------------------
  ssl_certificate     /etc/ssl/crown-clash/origin.pem;
  ssl_certificate_key /etc/ssl/crown-clash/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:crown_ssl:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  # No OCSP stapling: an Origin CA certificate has no public OCSP responder, and the only
  # client is Cloudflare, which does not request a stapled response.

  # A second lock on top of the firewall. Authenticated Origin Pulls makes nginx reject any TLS
  # client that cannot present Cloudflare's client certificate, so even a leaked origin IP
  # cannot be used to bypass the edge. Enable after fetching the CA (ops/README.md); leaving it
  # commented is not a hole, it just means the firewall is the only layer.
  # ssl_client_certificate /etc/ssl/crown-clash/cloudflare-origin-pull-ca.pem;
  # ssl_verify_client on;

  # -- Cloudflare real client IP -----------------------------------------------------------
  include /etc/nginx/snippets/crown-cloudflare-realip.conf;

  # -- Static root -------------------------------------------------------------------------
  # A symlink that ops/deploy.sh swaps atomically. `open_file_cache` is deliberately left off:
  # with it on, nginx would keep serving the previous release's inodes for the cache validity
  # window after the swap, which turns a clean deploy into a mixed one.
  root /var/www/crown-clash/current;
  index index.html;

  # The largest legitimate body is a save migration; a match-finish deploy log is ~15 KB. This
  # sits a little above the API's own BODY_LIMIT_BYTES (256 KB default) on purpose, so an
  # oversized request is refused by Fastify in the API's JSON error shape rather than by nginx
  # with an HTML 413 the client cannot parse.
  client_max_body_size 512k;
  client_body_timeout  20s;
  client_header_timeout 20s;

  # -- Compression -------------------------------------------------------------------------
  # Cloudflare compresses at the edge, so this mainly affects edge cache-fill and direct origin
  # fetches. Cheap enough to leave on.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/manifest+json image/svg+xml application/wasm;

  # Brotli beats gzip by roughly 15% on this bundle but is NOT built into stock nginx. Install
  # libnginx-mod-http-brotli-filter + libnginx-mod-http-brotli-static, then uncomment.
  # Uncommenting without the module installed makes nginx refuse to start.
  # brotli on;
  # brotli_comp_level 5;
  # brotli_types text/plain text/css text/javascript application/javascript application/json
  #              application/manifest+json image/svg+xml application/wasm;

  # -- Security headers --------------------------------------------------------------------
  # Included again in every location that sets its own add_header — see the snippet's comment
  # for why nginx forces that duplication.
  include /etc/nginx/snippets/crown-security-headers.conf;

  # -- API ---------------------------------------------------------------------------------
  location /api/ {
    proxy_pass http://crown_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";          # required for the upstream keepalive above

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;   # rewrite, never append — see header note
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
    proxy_set_header CF-Ray            $http_cf_ray;
    proxy_set_header CF-IPCountry      $http_cf_ipcountry;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    # A match re-simulation replays a 180 s battle at 30 Hz — well under a second on this
    # hardware. 30 s leaves room for a cold start without letting a stall become a 504 storm.
    proxy_read_timeout    30s;

    # Responses are small JSON; buffering keeps the Node event loop away from slow readers.
    proxy_buffering on;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Fastify Set-Cookie's the session here. Nothing in this path may ever be cached, by us or
    # by Cloudflare.
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    include /etc/nginx/snippets/crown-security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # -- Websocket (Phase 2 PvP) -------------------------------------------------------------
  # `/ws`, not `/api/ws` — that is the path apps/server/src/ws.ts registers. Phase 1 never
  # opens this socket; the route is here so shipping PvP needs no nginx change.
  location = /ws {
    proxy_pass http://crown_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $crown_connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

    # A matchmaking queue idles for tens of seconds and a match runs three minutes; the default
    # 60 s read timeout would cut the socket mid-battle. Cloudflare's own ~100 s proxy idle
    # timeout is the real ceiling, which is why ws.ts answers `ping` with `pong`.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # -- Health check ------------------------------------------------------------------------
  # Out of the access log: ops/deploy.sh polls it hard during a release and an uptime monitor
  # hits it forever; logging that only buries the lines worth reading.
  location = /api/health {
    access_log off;
    proxy_pass http://crown_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
  }

  # -- Static ------------------------------------------------------------------------------
  location /assets/ {
    access_log off;
    include /etc/nginx/snippets/crown-security-headers.conf;
    add_header Cache-Control $crown_cache_control always;
    # A missing hashed asset is a broken deploy, not a route. Falling back to index.html would
    # answer a .js request with HTML and produce a baffling MIME-type error in the console.
    try_files $uri =404;
  }

  # SPA fallback. The landing page and the app are one document (handoff §6: "the landing page
  # ships as the site's / with PLAY NOW entering the app"), so every non-file path serves
  # index.html and the client decides what to show.
  location / {
    include /etc/nginx/snippets/crown-security-headers.conf;
    add_header Cache-Control $crown_cache_control always;
    try_files $uri $uri/ /index.html;
  }

  # Dotfiles have no business in a build output; if one appears, hide it rather than serve it.
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  access_log /var/log/nginx/crown-clash.access.log;
  error_log  /var/log/nginx/crown-clash.error.log warn;
}
