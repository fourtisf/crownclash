# Security headers, shared by every location in crown-clash.conf.
#
# This exists as a snippet because of an nginx footgun: `add_header` is NOT additive across
# levels — a location that declares even one `add_header` stops inheriting all of the ones set
# on its server block. Duplicating the list by hand in five locations is how one of them ends
# up without a CSP six months from now. Include this instead.
#
# Install as /etc/nginx/snippets/crown-security-headers.conf (ops/README.md).
#
# `always` on each header so they are emitted on 4xx/5xx too, which is exactly where a missing
# nosniff or frame-ancestors matters.

add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-Frame-Options           "DENY" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

# Start conservative. 2 years + includeSubDomains + preload is a one-way door — raise it (and
# turn on HSTS at the Cloudflare edge as well) once the domain has been stable for a while.
add_header Strict-Transport-Security "max-age=86400" always;

# Tuned to what this app actually loads. Widen only with evidence from the console:
#   script-src  'self'          the Vite build emits one external module script; no inline JS.
#   style-src   'unsafe-inline' index.html carries inline style attributes (style="--d:70ms")
#                               and Google Fonts serves a stylesheet from fonts.googleapis.com.
#   font-src    gstatic         Lilita One / Baloo 2 — handoff §6 keeps the fonts.
#   img-src     data: blob:     the art engine is procedural canvas; portraits become data URLs.
#   connect-src 'self'          the API and the Phase-2 /ws socket are same-origin, and CSP3
#                               'self' covers ws/wss on the same host.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'" always;
